<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weighted Subject Caller</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    display: flex;
    justify-content: center;
    padding: 40px;
}

.container {
    background: white;
    padding: 25px;
    width: 420px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
}

input, button {
    width: 100%;
    padding: 8px;
    margin: 6px 0;
}

button {
    cursor: pointer;
    font-weight: bold;
}

button:disabled {
    background: #ccc;
    cursor: not-allowed;
}

#subjectList {
    height: 120px;
    width: 100%;
}

.status {
    font-weight: bold;
    margin: 8px 0;
}

.remaining {
    color: #0077cc;
}

.valid {
    color: green;
}

.invalid {
    color: red;
}
</style>
</head>

<body>

<div class="container">
<h1>Weighted Subject Caller</h1>

<label>Subject Name</label>
<input type="text" id="subjectName">

<label>Weight (0.01 - 1.00)</label>
<input type="number" id="subjectWeight" step="0.01" min="0.01" max="1.00">

<button id="addBtn">Add Subject</button>

<div class="status">
Remaining Probability: <span id="remaining" class="remaining">1.00</span>
</div>

<select id="subjectList" size="6"></select>

<label>Voice Speed</label>
<input type="range" id="voiceSpeed" min="0.5" max="2" step="0.1" value="1">

<button id="startBtn" disabled>Start</button>
<button id="resetBtn">Reset</button>

</div>

<script>
let subjects = [];
let totalWeight = 0;

const addBtn = document.getElementById("addBtn");
const startBtn = document.getElementById("startBtn");
const resetBtn = document.getElementById("resetBtn");
const remainingDisplay = document.getElementById("remaining");
const subjectList = document.getElementById("subjectList");
const voiceSpeed = document.getElementById("voiceSpeed");

function updateRemaining() {
    let remaining = (1 - totalWeight).toFixed(2);
    remainingDisplay.textContent = remaining;

    if (remaining === "0.00") {
        remainingDisplay.className = "valid";
        startBtn.disabled = false;
    } else {
        remainingDisplay.className = "remaining";
        startBtn.disabled = true;
    }
}

addBtn.addEventListener("click", () => {
    const name = document.getElementById("subjectName").value.trim();
    const weight = parseFloat(document.getElementById("subjectWeight").value);

    if (!name || isNaN(weight)) return;

    if (weight < 0.01 || weight > 1.00) {
        alert("Weight must be between 0.01 and 1.00");
        return;
    }

    if ((totalWeight + weight) > 1.000001) {
        alert("Weight exceeds remaining probability.");
        return;
    }

    subjects.push({ name, weight });
    totalWeight += weight;

    const option = document.createElement("option");
    option.text = `${name} (${weight.toFixed(2)})`;
    subjectList.add(option);

    document.getElementById("subjectName").value = "";
    document.getElementById("subjectWeight").value = "";

    updateRemaining();
});

startBtn.addEventListener("click", () => {
    if (totalWeight.toFixed(2) !== "1.00") return;

    const rand = Math.random();
    let cumulative = 0;

    for (let subject of subjects) {
        cumulative += subject.weight;
        if (rand <= cumulative) {
            announce(subject.name);
            alert("Selected: " + subject.name);
            return;
        }
    }
});

function announce(text) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = parseFloat(voiceSpeed.value);
    speechSynthesis.speak(utterance);
}

resetBtn.addEventListener("click", () => {
    subjects = [];
    totalWeight = 0;
    subjectList.innerHTML = "";
    updateRemaining();
});

updateRemaining();
</script>

</body>
</html>
