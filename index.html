<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Caller</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
        }
        
        .header {
            margin-bottom: 20px;
        }
        
        .add-section {
            margin-bottom: 20px;
            padding: 10px;
            background-color: #f0f0f0;
            border-radius: 5px;
        }
        
        .subject-item {
            margin: 10px 0;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: white;
        }
        
        .subject-item input[type="text"] {
            width: 200px;
            padding: 5px;
            margin-right: 10px;
        }
        
        .subject-item input[type="number"] {
            width: 100px;
            padding: 5px;
            margin-right: 10px;
        }
        
        button {
            padding: 8px 15px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-size: 14px;
        }
        
        #addSubject {
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            padding: 10px 20px;
        }
        
        #addSubject:hover {
            background-color: #45a049;
        }
        
        .remove-subject {
            background-color: #f44336;
            color: white;
        }
        
        .remove-subject:hover {
            background-color: #da190b;
        }
        
        .settings {
            margin: 20px 0;
            padding: 15px;
            background-color: #e8f4f8;
            border-radius: 5px;
        }
        
        .settings label {
            display: inline-block;
            margin-right: 10px;
            font-weight: bold;
        }
        
        .settings select,
        .settings input {
            padding: 5px;
            margin-right: 20px;
        }
        
        .probability-info {
            margin: 15px 0;
            padding: 10px;
            background-color: #fff9e6;
            border-left: 4px solid #ffc107;
            font-size: 16px;
        }
        
        .controls {
            margin: 20px 0;
        }
        
        #startButton {
            background-color: #2196F3;
            color: white;
            font-size: 18px;
            padding: 12px 30px;
            margin-right: 10px;
        }
        
        #startButton:hover:not(:disabled) {
            background-color: #0b7dda;
        }
        
        #startButton:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        #stopButton {
            background-color: #ff9800;
            color: white;
            font-size: 18px;
            padding: 12px 30px;
        }
        
        #stopButton:hover:not(:disabled) {
            background-color: #e68900;
        }
        
        #stopButton:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        .current-display {
            margin-top: 30px;
            padding: 30px;
            background-color: #f8f9fa;
            border: 3px solid #007bff;
            border-radius: 10px;
            text-align: center;
        }
        
        .current-display h3 {
            margin: 0 0 15px 0;
            color: #333;
        }
        
        #currentSubject {
            font-size: 36px;
            font-weight: bold;
            color: #007bff;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Subject Caller</h1>
    </div>
    
    <div class="add-section">
        <button id="addSubject">Add Subject</button>
        <span id="subjectCount" style="margin-left: 20px; font-weight: bold;">Subjects: 0/100</span>
    </div>
    
    <div id="subjectsContainer"></div>
    
    <div class="probability-info">
        <strong>Total Probability:</strong> <span id="totalProbability">0.00</span>
        <span id="probabilityWarning" style="margin-left: 15px; font-weight: bold;"></span>
    </div>
    
    <div class="settings">
        <h3>Settings</h3>
        <div style="margin-bottom: 10px;">
            <label>Speed of Voice:</label>
            <select id="voiceSpeed">
                <option value="0.7">Slow</option>
                <option value="1.0" selected>Medium</option>
                <option value="1.5">Fast</option>
            </select>
        </div>
        
        <div>
            <label>Call interval (seconds):</label>
            <input type="number" id="callInterval" value="3" min="1" max="60" style="width: 80px;">
        </div>
    </div>
    
    <div class="controls">
        <button id="startButton" disabled>Start Calling</button>
        <button id="stopButton" disabled>Stop Calling</button>
    </div>
    
    <div class="current-display">
        <h3>Currently Called:</h3>
        <p id="currentSubject">---</p>
    </div>

    <script>
        let subjects = [];
        let isRunning = false;
        let intervalId = null;

        const addSubjectBtn = document.getElementById('addSubject');
        const subjectsContainer = document.getElementById('subjectsContainer');
        const subjectCount = document.getElementById('subjectCount');
        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');
        const totalProbabilitySpan = document.getElementById('totalProbability');
        const probabilityWarning = document.getElementById('probabilityWarning');
        const currentSubjectDisplay = document.getElementById('currentSubject');
        const voiceSpeedSelect = document.getElementById('voiceSpeed');
        const callIntervalInput = document.getElementById('callInterval');

        // Event listeners
        addSubjectBtn.addEventListener('click', addSubject);
        startButton.addEventListener('click', startCalling);
        stopButton.addEventListener('click', stopCalling);

        function addSubject() {
            if (subjects.length >= 100) {
                alert('Maximum 100 subjects allowed');
                return;
            }

            const subjectId = Date.now() + Math.random(); // Ensure unique ID
            const subject = {
                id: subjectId,
                name: '',
                probability: 0
            };

            subjects.push(subject);
            renderSubject(subject);
            updateSubjectCount();
            updateTotalProbability();
        }

        function renderSubject(subject) {
            const subjectDiv = document.createElement('div');
            subjectDiv.id = `subject-${subject.id}`;
            subjectDiv.className = 'subject-item';

            subjectDiv.innerHTML = `
                <label>Name:</label>
                <input type="text" class="subject-name" data-id="${subject.id}" value="${subject.name}" placeholder="Enter subject name">
                
                <label>Probability:</label>
                <input type="number" class="subject-probability" data-id="${subject.id}" value="${subject.probability}" 
                       min="0" max="1" step="0.01" placeholder="0.00">
                
                <button class="remove-subject" data-id="${subject.id}">Remove</button>
            `;

            subjectsContainer.appendChild(subjectDiv);

            // Add event listeners
            const nameInput = subjectDiv.querySelector('.subject-name');
            const probabilityInput = subjectDiv.querySelector('.subject-probability');
            const removeButton = subjectDiv.querySelector('.remove-subject');

            nameInput.addEventListener('input', (e) => {
                const subj = subjects.find(s => s.id == e.target.dataset.id);
                if (subj) {
                    subj.name = e.target.value;
                }
            });

            probabilityInput.addEventListener('input', (e) => {
                const subj = subjects.find(s => s.id == e.target.dataset.id);
                if (subj) {
                    subj.probability = parseFloat(e.target.value) || 0;
                    updateTotalProbability();
                }
            });

            removeButton.addEventListener('click', (e) => {
                removeSubject(e.target.dataset.id);
            });
        }

        function removeSubject(subjectId) {
            subjects = subjects.filter(s => s.id != subjectId);
            const subjectDiv = document.getElementById(`subject-${subjectId}`);
            if (subjectDiv) {
                subjectDiv.remove();
            }
            updateSubjectCount();
            updateTotalProbability();
        }

        function updateSubjectCount() {
            subjectCount.textContent = `Subjects: ${subjects.length}/100`;
        }

        function updateTotalProbability() {
            const total = subjects.reduce((sum, subject) => sum + subject.probability, 0);
            totalProbabilitySpan.textContent = total.toFixed(2);

            if (Math.abs(total - 1.0) < 0.01 && subjects.length > 0) {
                probabilityWarning.textContent = '✓ Ready to start';
                probabilityWarning.style.color = 'green';
                startButton.disabled = false;
            } else {
                if (subjects.length === 0) {
                    probabilityWarning.textContent = 'Add subjects first';
                } else {
                    probabilityWarning.textContent = 'Must equal 1.00';
                }
                probabilityWarning.style.color = 'red';
                startButton.disabled = true;
            }
        }

        function selectRandomSubject() {
            const random = Math.random();
            let cumulativeProbability = 0;

            for (let subject of subjects) {
                cumulativeProbability += subject.probability;
                if (random <= cumulativeProbability) {
                    return subject;
                }
            }

            return subjects[subjects.length - 1];
        }

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            const speed = parseFloat(voiceSpeedSelect.value);
            utterance.rate = speed;
            
            // Cancel any ongoing speech before starting new one
            speechSynthesis.cancel();
            speechSynthesis.speak(utterance);
        }

        function callSubject() {
            const subject = selectRandomSubject();
            if (subject && subject.name && subject.name.trim() !== '') {
                currentSubjectDisplay.textContent = subject.name;
                speak(subject.name);
            }
        }

        function startCalling() {
            if (isRunning) return;

            // Validate that we have subjects with names
            const validSubjects = subjects.filter(s => s.name && s.name.trim() !== '');
            if (validSubjects.length === 0) {
                alert('Please add at least one subject with a name');
                return;
            }

            isRunning = true;
            startButton.disabled = true;
            stopButton.disabled = false;
            addSubjectBtn.disabled = true;

            // Disable all inputs
            document.querySelectorAll('.subject-name, .subject-probability, .remove-subject').forEach(el => {
                el.disabled = true;
            });

            // Disable settings
            voiceSpeedSelect.disabled = true;
            callIntervalInput.disabled = true;

            // Call first subject immediately
            callSubject();

            // Set up interval for subsequent calls
            const interval = parseInt(callIntervalInput.value) * 1000;
            intervalId = setInterval(callSubject, interval);
        }

        function stopCalling() {
            if (!isRunning) return;

            isRunning = false;
            startButton.disabled = false;
            stopButton.disabled = true;
            addSubjectBtn.disabled = false;

            // Re-enable all inputs
            document.querySelectorAll('.subject-name, .subject-probability, .remove-subject').forEach(el => {
                el.disabled = false;
            });

            // Re-enable settings
            voiceSpeedSelect.disabled = false;
            callIntervalInput.disabled = false;

            // Clear interval
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }

            // Stop any ongoing speech
            speechSynthesis.cancel();

            currentSubjectDisplay.textContent = '---';
        }

        // Initialize
        updateSubjectCount();
        updateTotalProbability();
        
        console.log('Subject Caller initialized successfully');
    </script>
</body>
</html>
